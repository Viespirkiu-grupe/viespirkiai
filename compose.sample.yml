services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                # Footer'io versijos nuoroda. Paprastai palikti tuščią – build'as
                # hash'ą pasiima iš .git. Nurodyti reikia tik statant ten, kur
                # .git nepasiekiamas (pvz. iš archyvo).
                GIT_COMMIT: ${GIT_COMMIT:-}
        network_mode: host
        restart: unless-stopped
        # Konfigūracija per .env (žr. .env.sample).
        env_file:
            - .env
        volumes:
            # Runtime katalogai – NEsukepti į image'ą.
            - ./public:/app/public:ro
            - ./modules:/app/modules:ro
            # Absoliutūs duomenų keliai iš config.js (ocr/failai/dokumentai/...)
            - /flashas/viespirkiai:/flashas/viespirkiai
        healthcheck:
            # Namų puslapis turi atsidaryti (HTTP 200).
            test: ["CMD", "node", "-e", "fetch('http://localhost:9019/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 30s
            timeout: 30s
            retries: 3
            start_period: 40s
        deploy:
            resources:
                limits:
                    memory: 2G