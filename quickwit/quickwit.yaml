version: 0.8

rest:
  listen_port: 7280

ingest_api:
  max_queue_memory_usage: 1GiB
  max_queue_disk_usage: 4GiB
  content_length_limit: 500MiB

indexer:
  split_store_max_num_bytes: 5G
  max_concurrent_split_uploads: 8

searcher:
  fast_field_cache_capacity: 4G
  split_footer_cache_capacity: 2G
  partial_request_cache_capacity: 512M
  aggregation_memory_limit: 1G
  aggregation_bucket_limit: 100000
  max_num_concurrent_split_searches: 200
  max_num_concurrent_split_streams: 200
